name: Build dsniff OpenWrt IPKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: filogic
        type: choice
        options:
          - mt7621
          - filogic
          - all

  push:
    branches:
      - main

jobs:
  build-mt7621:
    if: github.event_name == 'push' || github.event.inputs.target == 'mt7621' || github.event.inputs.target == 'all'

    runs-on: ubuntu-24.04

    env:
      SDK_DIR: ${{ github.workspace }}/openwrt-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zstd \
            xz-utils \
            file

      - name: Download OpenWrt 23.05.5 MT7621 SDK
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          SDK_URL="https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7621/openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          SDK_FILE="${SDK_URL##*/}"

          wget -q --show-progress "$SDK_URL"

          wget -q "https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7621/sha256sums"

          grep "  $SDK_FILE\$" sha256sums | sha256sum -c -

          rm -rf "$SDK_DIR"
          mkdir -p "$SDK_DIR"

          tar -xJf "$SDK_FILE" \
            --strip-components=1 \
            -C "$SDK_DIR"

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Copy dsniff package
        run: |
          set -eux

          rm -rf "$SDK_DIR/package/dsniff"
          mkdir -p "$SDK_DIR/package/dsniff"

          cp -a package/dsniff/. "$SDK_DIR/package/dsniff/"

      - name: Update OpenWrt feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable Berkeley DB compat185
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== Locate Berkeley DB Makefile ==="

          DB_MK="$(find feeds package -path '*/db/Makefile' -print -quit)"

          echo "DB_MK=$DB_MK"

          if [ -z "$DB_MK" ]; then
            echo "ERROR: Berkeley DB Makefile not found"
            exit 1
          fi

          echo
          echo "=== Before modification ==="
          grep -n "enable-compat185" "$DB_MK" || true

          if grep -q -- "--enable-compat185" "$DB_MK"; then
            echo "--enable-compat185 already present"
          else
            sed -i '/CONFIGURE_ARGS += \\/a\	--enable-compat185 \\' "$DB_MK"
          fi

          echo
          echo "=== After modification ==="
          grep -n -A8 -B2 "CONFIGURE_ARGS" "$DB_MK" || true

      - name: Show dsniff package Makefile
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== dsniff Makefile ==="
          sed -n '1,240p' package/dsniff/Makefile

          echo
          echo "=== libdb47 ==="
          ./scripts/feeds search libdb47 || true

      - name: Configure SDK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          yes "" | make defconfig

      - name: Build dsniff
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          make package/dsniff/clean V=s || true
          make package/dsniff/compile V=s

      - name: Verify dsniff package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== Generated IPK files ==="

          find bin/packages \
            -type f \
            -name 'dsniff_*.ipk' \
            -print

          IPK="$(find bin/packages \
            -type f \
            -name 'dsniff_*.ipk' \
            -print -quit)"

          if [ -z "$IPK" ]; then
            echo "ERROR: dsniff IPK was not generated"
            exit 1
          fi

          echo
          echo "=== IPK ==="
          file "$IPK"

          echo
          echo "=== Package metadata ==="
          tar -xOf "$IPK" ./control.tar.gz | tar -xzOf - ./control

      - name: Upload MT7621 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsniff-openwrt-23.05.5-mt7621
          path: ${{ env.SDK_DIR }}/bin/packages/**/*.ipk
          if-no-files-found: error


  build-filogic:
    if: github.event_name == 'push' || github.event.inputs.target == 'filogic' || github.event.inputs.target == 'all'

    runs-on: ubuntu-24.04

    env:
      SDK_DIR: ${{ github.workspace }}/openwrt-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zstd \
            xz-utils \
            file

      - name: Download OpenWrt 24.10.0 Filogic SDK
        working-directory: ${{ github.workspace }}
        run: |
          set -eux

          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/mediatek/filogic/openwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          SDK_FILE="${SDK_URL##*/}"

          wget -q --show-progress "$SDK_URL"

          wget -q "https://downloads.openwrt.org/releases/24.10.0/targets/mediatek/filogic/sha256sums"

          grep "  $SDK_FILE\$" sha256sums | sha256sum -c -

          rm -rf "$SDK_DIR"
          mkdir -p "$SDK_DIR"

          tar --zstd -xf "$SDK_FILE" \
            --strip-components=1 \
            -C "$SDK_DIR"

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Copy dsniff package
        run: |
          set -eux

          rm -rf "$SDK_DIR/package/dsniff"
          mkdir -p "$SDK_DIR/package/dsniff"

          cp -a package/dsniff/. "$SDK_DIR/package/dsniff/"

      - name: Update OpenWrt feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable Berkeley DB compat185
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== Locate Berkeley DB Makefile ==="

          DB_MK="$(find feeds package -path '*/db/Makefile' -print -quit)"

          echo "DB_MK=$DB_MK"

          if [ -z "$DB_MK" ]; then
            echo "ERROR: Berkeley DB Makefile not found"
            exit 1
          fi

          echo
          echo "=== Before modification ==="
          grep -n "enable-compat185" "$DB_MK" || true

          if grep -q -- "--enable-compat185" "$DB_MK"; then
            echo "--enable-compat185 already present"
          else
            sed -i '/CONFIGURE_ARGS += \\/a\	--enable-compat185 \\' "$DB_MK"
          fi

          echo
          echo "=== After modification ==="
          grep -n -A8 -B2 "CONFIGURE_ARGS" "$DB_MK" || true

      - name: Show dsniff package Makefile
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== dsniff Makefile ==="
          sed -n '1,240p' package/dsniff/Makefile

          echo
          echo "=== libdb47 ==="
          ./scripts/feeds search libdb47 || true

      - name: Configure SDK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          yes "" | make defconfig

      - name: Build dsniff
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          make package/dsniff/clean V=s || true
          make package/dsniff/compile V=s

      - name: Verify dsniff package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -eux

          echo "=== Generated IPK files ==="

          find bin/packages \
            -type f \
            -name 'dsniff_*.ipk' \
            -print

          IPK="$(find bin/packages \
            -type f \
            -name 'dsniff_*.ipk' \
            -print -quit)"

          if [ -z "$IPK" ]; then
            echo "ERROR: dsniff IPK was not generated"
            exit 1
          fi

          echo
          echo "=== IPK ==="
          file "$IPK"

          echo
          echo "=== Package metadata ==="
          tar -xOf "$IPK" ./control.tar.gz | tar -xzOf - ./control

      - name: Upload Filogic artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsniff-openwrt-24.10.0-filogic
          path: ${{ env.SDK_DIR }}/bin/packages/**/*.ipk
          if-no-files-found: error
